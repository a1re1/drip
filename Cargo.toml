[package]
name = "drip"
version = "0.1.0"
edition = "2021"
description = "drip — Rust port of lci, a headless-first coding agent harness"

# Binaries: `drip` (port of src/cli/main.tsx) and `dripw` (port of src/cli/watch/*).
[[bin]]
name = "drip"
path = "src/main.rs"

[[bin]]
name = "dripw"
path = "src/bin/dripw.rs"

# Dependency allowlist (drip/PLAN.md + port brief): serde, serde_json, anyhow,
# thiserror, uuid, chrono, rusqlite (bundled), tokio, reqwest (rustls), regex,
# dirs, shell-words, indexmap, libc, glob, walkdir, tempfile (dev).
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
shell-words = "1"
dirs = "5"
chrono = { version = "0.4", features = ["clock", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
