[package]
name = "drip"
version = "0.97.0"
edition = "2021"
description = "drip — Rust port of lci, a headless-first coding agent harness"

# Binaries: `drip` (port of src/cli/main.tsx) and `dripw` (port of src/cli/watch/*).
[[bin]]
name = "drip"
path = "src/main.rs"

[[bin]]
name = "dripw"
path = "src/bin/dripw.rs"

# Dependency allowlist (drip/PLAN.md + port brief): serde, serde_json, anyhow,
# thiserror, uuid, chrono, rusqlite (bundled), tokio, reqwest (rustls), regex,
# dirs, shell-words, indexmap, libc, glob, walkdir, tempfile.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# Added for the tools port: destructive-command policy regexes
# (command-policy.ts) and shell tokenization for credential commands.
shell-words = "1"
dirs = "5"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
libc = "0.2"
# patch_journal.rs: sha256 pre-image digests (node:crypto createHash("sha256") in the TS).
sha2 = "0.10"
# marketplaces.rs addedAt timestamps (new Date().toISOString() in the TS).
# Added for --migrate-from-lci (drip-only, no TS counterpart): rusqlite
# checkpoints the copied index.sqlite via PRAGMA wal_checkpoint(TRUNCATE);
# walkdir walks the skills/marketplaces/sessions trees; dirs resolves the
# cross-platform home directory. tempfile stages the index.sqlite copy in a
# temp directory so the source database is never opened (migrate.rs).
walkdir = "2"
tempfile = "3"
# images.rs: data-URL base64 encoding/decoding (Buffer.toString("base64") in the TS).
base64 = "0.22"

[dev-dependencies]
